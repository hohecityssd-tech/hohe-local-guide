<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0E8">
  <title>HOHE CITY LOCAL GUIDE</title>

  <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <style>
    /* color ver1: hotel #95483B, food #C36D43, cafe #67584A, bar #34383B, spot #65727A; white icon strokes. */
    /* color ver2: approved marker backgrounds; dark strokes on light backgrounds. */
    :root{
      --bg:#F5F0E8;
      --panel:#FFFDF9;
      --text:#262522;
      --muted:#77736C;
      --line:#E5DED3;
      --hotel:#2A1A0E;
      --food:#F4AE52;
      --cafe:#D4621A;
      --bar:#AEAC78;
      --spot:#FEF3E2;
      --shop:#728E82;
      --transport:#426F91;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
    }

    .app{height:100dvh;display:flex;flex-direction:column}
    header{
      height:60px;flex:0 0 60px;
      display:flex;align-items:center;
      padding:0 16px;
      background:var(--bg);
      border-bottom:1px solid var(--line);
      z-index:10;
    }
    .brand{font-size:14px;font-weight:850;letter-spacing:.08em}
    .brand span{margin-left:7px;color:var(--muted);font-weight:650}

    #map{flex:1;min-height:0}

    .place-marker{
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      border:3px solid #fff;
      box-shadow:0 2px 10px rgba(0,0,0,.18);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      font-size:16px;
      line-height:1;
    }
    .place-marker svg{width:22px;height:22px;display:block;flex:none;pointer-events:none}
    .place-marker.hotel{background:var(--hotel);color:#fff}
    .place-marker.food{background:var(--food);color:#2A1A0E}
    .place-marker.cafe{background:var(--cafe);color:#fff}
    .place-marker.bar{background:var(--bar);color:#2A1A0E}
    .place-marker.spot{background:var(--spot);color:#2A1A0E}
    .place-marker.shop{background:var(--shop);color:#fff}
    .place-marker.transport{background:var(--transport);color:#fff}

    .hotel-wrap{display:flex;align-items:center;gap:6px}
    .hotel-label{
      background:rgba(255,253,249,.97);
      border:1px solid var(--line);
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      border-radius:8px;
      padding:5px 7px;
      font-size:11px;
      font-weight:850;
      letter-spacing:.04em;
      white-space:nowrap;
    }

    .locate{
      position:absolute;right:12px;top:74px;z-index:9;
      height:40px;
      border:1px solid var(--line);
      border-radius:11px;
      background:rgba(255,253,249,.97);
      color:var(--text);
      font-weight:800;
      font-size:12px;
      padding:0 12px;
      box-shadow:0 3px 12px rgba(0,0,0,.10);
      cursor:pointer;
    }

    .sheet{
      position:fixed;left:12px;right:12px;
      bottom:max(12px,env(safe-area-inset-bottom));
      max-height:calc(100dvh - 84px);
      overflow-y:auto;
      z-index:20;
      background:rgba(255,253,249,.99);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      box-shadow:0 12px 34px rgba(0,0,0,.18);
      transform:translateY(calc(100% + 32px));
      transition:transform .2s ease;
    }
    .sheet.open{transform:translateY(0)}
    .photo-gallery{margin:-16px -16px 14px;overflow:hidden;border-radius:15px 15px 0 0;background:#E8E3DC;}
    .photo-gallery[hidden],.photo-viewer[hidden]{display:none!important}
    .photo-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
    .photo-track::-webkit-scrollbar{display:none}
    .photo-slide{width:100%;min-width:100%;flex:0 0 100%;height:clamp(170px,30vh,220px);
      padding:0;border:0;background:#ECE9E3;scroll-snap-align:start;cursor:zoom-in;display:block;overflow:hidden}
    .photo-slide img{display:block;width:100%;height:100%;object-fit:cover}
    .photo-caption-line{display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:var(--panel);padding:8px 12px;font-size:11px;color:var(--muted)}
    .photo-caption{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .photo-count{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
    .photo-viewer{position:fixed;z-index:99;inset:0;background:rgba(18,18,18,.96);
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 12px 30px}
    .photo-viewer img{display:block;max-width:100%;max-height:75dvh;width:auto;height:auto;object-fit:contain}
    .photo-viewer-close{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top));width:42px;height:42px;
      color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:50%;font-size:25px;cursor:pointer}
    .photo-viewer-bottom{color:#fff;text-align:center;font-size:12px;margin-top:12px;min-height:36px}
    .photo-viewer-controls{display:flex;align-items:center;gap:18px;justify-content:center;margin-top:10px}
    .photo-viewer-controls button{background:rgba(255,255,255,.15);border:0;border-radius:9px;padding:8px 17px;color:#fff;font-size:18px;cursor:pointer}
    .photo-viewer-controls button[hidden]{display:none}
    .close{z-index:3;background:rgba(255,253,249,.92);border-radius:50%}
    .sheet-name{font-size:18px;font-weight:850;margin-right:36px}
    .sheet-local{font-size:12px;color:var(--muted);margin-top:2px}
    .sheet-desc{font-size:14px;color:var(--muted);margin:4px 0 14px}
    .close{
      position:absolute;right:10px;top:8px;
      width:34px;height:34px;border:0;background:transparent;
      color:var(--muted);font-size:25px;cursor:pointer;
    }
    .map-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .map-actions[hidden]{display:none}
    .directions{
      width:100%;height:48px;border:0;border-radius:11px;
      background:var(--text);color:#fff;
      font-size:14px;font-weight:850;letter-spacing:.04em;
      cursor:pointer;
    }
    .directions.secondary{
      background:var(--panel);color:var(--text);
      border:1px solid var(--line);
    }
    .hotel-note{font-size:12px;color:var(--muted)}
    .hours-panel{
      margin:0 0 14px;padding:11px 12px;
      background:#F8F5EF;border:1px solid var(--line);border-radius:11px;
      font-size:12px;
    }
    .hours-panel[hidden]{display:none}
    .hours-today{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .hours-today-label{color:var(--muted);font-weight:650}
    .hours-today-value{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
    .hours-panel details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
    .hours-panel summary{cursor:pointer;font-weight:750;list-style-position:inside}
    .hours-weekly{display:grid;gap:6px;margin-top:10px}
    .hour-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .hour-row.today{font-weight:800}
    .hour-row .time{font-variant-numeric:tabular-nums;text-align:right}
    .hours-note{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.4}
    .bus-panel{margin:0 0 14px;padding:12px;background:#F1F5F7;border:1px solid #D8E1E8;border-radius:11px;font-size:12px}
    .bus-panel[hidden]{display:none}
    .bus-head{font-weight:800;font-size:13px;margin-bottom:9px}
    .bus-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .bus-time{padding:9px 10px;border:1px solid #D8E1E8;border-radius:9px;background:rgba(255,255,255,.75)}
    .bus-time-label{display:block;color:var(--muted);font-size:11px}
    .bus-time-value{display:block;font-size:19px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:3px}
    .bus-details{margin-top:9px;font-size:12px;line-height:1.55}
    .bus-caution{color:var(--muted);font-size:11px;line-height:1.5;margin:8px 0 0}
    .bus-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
    .bus-links a{color:#275877;font-weight:750;text-decoration:underline;text-underline-offset:2px}
    .bus-payment{border-top:1px solid #D8E1E8;margin-top:13px;padding-top:12px}
    .bus-payment[hidden]{display:none}
    .bus-payment-title{font-size:13px;font-weight:850;margin-bottom:8px}
    .bus-payment-row{display:grid;grid-template-columns:1fr;gap:3px;margin:8px 0}
    .bus-payment-label{font-size:11px;color:var(--muted)}
    .bus-payment-value{font-weight:750;font-size:12px;line-height:1.5}
    .bus-payment-yes{color:#236A4C}
    .bus-payment-no{color:#A13F3F}
    .bus-payment-note{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0 0}
    .bus-payment-source{display:inline-block;margin-top:9px;font-size:11px;font-weight:750;color:#275877;text-decoration:underline;text-underline-offset:2px}
    .hours-extras{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
    .hours-extras[hidden]{display:none}

    .maplibregl-ctrl-attrib{font-size:9px;opacity:.68}

    @media(min-width:800px){
      .app{max-width:580px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.08)}
      .sheet{width:556px;left:50%;right:auto;transform:translate(-50%,calc(100% + 32px))}
      .sheet.open{transform:translate(-50%,0)}
    }
  </style>
</head>

<body>
<main class="app">
  <header><div class="brand">HOHE CITY <span>LOCAL GUIDE</span></div></header>
  <div id="map"></div>
  <button class="locate" id="locateBtn">◎ MY LOCATION</button>
</main>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="close" aria-label="Close" id="closeBtn">×</button>
  <div class="photo-gallery" id="photoGallery" hidden aria-label="Place photos">
    <div class="photo-track" id="photoTrack"></div>
    <div class="photo-caption-line">
      <span class="photo-caption" id="photoCaption"></span>
      <span class="photo-count" id="photoCount"></span>
    </div>
  </div>
  <div class="sheet-name" id="sheetName"></div>
  <div class="sheet-local" id="sheetLocal"></div>
  <div class="sheet-desc" id="sheetDesc"></div>
  <div class="hours-panel" id="hoursPanel" hidden>
    <div class="hours-today">
      <span class="hours-today-label" id="hoursTodayLabel"></span>
      <strong class="hours-today-value" id="hoursTodayValue"></strong>
    </div>
    <div class="hours-extras" id="hoursExtras" hidden></div>
    <details id="weeklyHoursDetails">
      <summary id="weeklyHoursSummary"></summary>
      <div class="hours-weekly" id="weeklyHoursRows"></div>
    </details>
    <p class="hours-note" id="hoursNote"></p>
  </div>
  <div class="bus-panel" id="busPanel" hidden>
    <div class="bus-head" id="busHeading"></div>
    <div class="bus-times">
      <div class="bus-time"><span class="bus-time-label" id="busFirstLabel"></span><strong class="bus-time-value" id="busFirstValue"></strong></div>
      <div class="bus-time"><span class="bus-time-label" id="busLastLabel"></span><strong class="bus-time-value" id="busLastValue"></strong></div>
    </div>
    <div class="bus-details" id="busDetails"></div>
    <p class="bus-caution" id="busCaution"></p>
    <section class="bus-payment" id="busPaymentPanel" hidden aria-label="Bus payment methods">
      <div class="bus-payment-title" id="busPaymentTitle"></div>
      <div class="bus-payment-row">
        <span class="bus-payment-label" id="busPaymentCashLabel"></span>
        <strong class="bus-payment-value bus-payment-yes" id="busPaymentCash"></strong>
      </div>
      <div class="bus-payment-row">
        <span class="bus-payment-label" id="busPaymentTransitLabel"></span>
        <strong class="bus-payment-value bus-payment-yes" id="busPaymentTransit"></strong>
      </div>
      <div class="bus-payment-row">
        <span class="bus-payment-label" id="busPaymentCreditLabel"></span>
        <strong class="bus-payment-value bus-payment-no" id="busPaymentCredit"></strong>
      </div>
      <p class="bus-payment-note" id="busPaymentWowpass"></p>
      <p class="bus-payment-note" id="busPaymentCashNote"></p>
      <a class="bus-payment-source" id="busPaymentSource" target="_blank" rel="noopener noreferrer"></a>
    </section>
    <div class="bus-links">
      <a id="busTimetableLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      <a id="busOfficialLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>
  <div class="map-actions" id="mapActions">
    <button class="directions" id="directionsBtn">NAVER MAP</button>
    <button class="directions secondary" id="googleBtn">GOOGLE MAPS</button>
  </div>
  <div class="hotel-note" id="hotelNote" hidden>This is your hotel.</div>
</section>

<div class="photo-viewer" id="photoViewer" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="photo-viewer-close" id="photoViewerClose" type="button" aria-label="Close photo">×</button>
  <img id="photoViewerImg" alt="">
  <div class="photo-viewer-bottom" id="photoViewerCaption"></div>
  <div class="photo-viewer-controls">
    <button type="button" id="photoViewerPrev" aria-label="Previous photo">‹</button>
    <span class="photo-count" id="photoViewerCount" style="color:#fff"></span>
    <button type="button" id="photoViewerNext" aria-label="Next photo">›</button>
  </div>
</div>

<script>
let places = [];

function detectLocale(){
  const forced = new URLSearchParams(window.location.search).get("lang");
  const raw = (forced || (navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase();

  if(raw.startsWith("ja")) return "ja";
  if(raw.startsWith("ko")) return "ko";
  if(raw.startsWith("zh")){
    if(raw.includes("tw") || raw.includes("hk") || raw.includes("mo") || raw.includes("hant")) return "zhHant";
    return "zhHans";
  }
  return "en";
}

const locale = detectLocale();
const htmlLang = {en:"en", ja:"ja", ko:"ko", zhHans:"zh-CN", zhHant:"zh-TW"}[locale] || "en";
document.documentElement.lang = htmlLang;

const ui = {
  en:{
    myLocation:"◎ MY LOCATION",
    naver:"NAVER MAP",
    google:"GOOGLE MAPS",
    hotel:"This is your hotel.",
    noLocation:"Location is not available on this device.",
    allowLocation:"Please allow location access to show your position.",
    loadError:"The local guide could not be loaded. Please try again."
  },

    myLocation:"◎ 現在地",

    google:"GOOGLE MAPS",

    noLocation:"此设备无法使用定位功能。",
    allowLocation:"请允许定位权限以显示您的位置。",
    loadError:"无法加载本地指南，请重试。"
  },
  zhHant:{
    myLocation:"◎ 我的位置",
    naver:"NAVER 地圖",
    google:"GOOGLE 地圖",
    hotel:"這裡是您的飯店。",
    noLocation:"此裝置無法使用定位功能。",
    allowLocation:"請允許定位權限以顯示您的位置。",
    loadError:"無法載入周邊指南，請再試一次。"
  },
  ko:{
    myLocation:"◎ 내 위치",
    naver:"네이버 지도",
    google:"구글 지도",
    hotel:"여기가 호텔입니다.",
    noLocation:"이 기기에서는 현재 위치를 사용할 수 없습니다.",
    allowLocation:"현재 위치를 표시하려면 위치 권한을 허용해주세요.",
    loadError:"주변 가이드를 불러오지 못했습니다. 다시 시도해주세요."
  }
}[locale];

// Operating hours are displayed in the place's local time (Asia/Seoul).
const hoursUi = {
  en:{today:"Today's hours",weekly:"View all opening hours",closed:"Closed",unknown:"Please confirm",nextDay:"next day",note:"Holiday hours may differ. Please check before visiting.",conflict:"Listed hours differ across sources. Please confirm before visiting.",breakTime:"Break",lastOrder:"Last order",days:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]},
  ja:{today:"本日の営業時間",weekly:"曜日別の営業時間を見る",closed:"定休日",unknown:"要確認",nextDay:"翌日",note:"祝日などは営業時間が異なる場合があります。",conflict:"掲載サイトによって営業時間が異なります。来店前にご確認ください。",breakTime:"休憩時間",lastOrder:"ラストオーダー",days:["月","火","水","木","金","土","日"]},
  zhHans:{today:"今日营业时间",weekly:"查看每周营业时间",closed:"休息",unknown:"请确认",nextDay:"次日",note:"节假日营业时间可能有所不同。",conflict:"各平台营业时间信息不一致，建议到店前再次确认。",breakTime:"休息时间",lastOrder:"最后点单",days:["周一","周二","周三","周四","周五","周六","周日"]},
  zhHant:{today:"今日營業時間",weekly:"查看每週營業時間",closed:"公休",unknown:"請確認",nextDay:"隔日",note:"節假日營業時間可能有所不同。",conflict:"各平台營業時間不一致，建議到店前再次確認。",breakTime:"休息時間",lastOrder:"最後點餐",days:["週一","週二","週三","週四","週五","週六","週日"]},
  ko:{today:"오늘 영업시간",weekly:"요일별 영업시간 보기",closed:"정기휴무",unknown:"확인 필요",nextDay:"익일",note:"공휴일 및 임시휴무에는 운영시간이 달라질 수 있습니다.",conflict:"플랫폼별 영업시간 정보가 달라 방문 전 재확인이 필요합니다.",breakTime:"브레이크타임",lastOrder:"라스트오더",days:["월","화","수","목","금","토","일"]}
}[locale];

const busUi = {
  en:{heading:"Bus 6002 · Sinseol-dong stop (06008)",first:"First bus · from Cheongnyangni",last:"Last bus · from Cheongnyangni",unverified:"Check timetable",daily:"Daily",interval:"Frequency",minutes:"min",adult:"Adult",child:"Child",official:"Official 6002 timetable ↗",caution:"Times above are official departures from Cheongnyangni, NOT boarding times at Sinseol-dong. The bus arrives here later. Check the stop's arrival information before boarding."},
  ja:{heading:"6002番 · 新設洞停留所 (06008)",first:"始発 · 清凉里駅発",last:"最終 · 清凉里駅発",unverified:"要確認",daily:"毎日",interval:"運行間隔",minutes:"分",adult:"大人",child:"子ども",official:"公式6002時刻表 ↗",caution:"上記は清凉里駅発の公式時刻です。新設洞停留所の乗車時刻ではなく、バスはその後に到着します。乗車前に停留所の到着情報をご確認ください。"},

function renderHours(place){
  const hours = place.hours;
  hoursPanel.hidden = !hours;
  if(!hours) return;

  const keys = ["mon","tue","wed","thu","fri","sat","sun"];
  const now = new Date();
  const timeZone = hours.timeZone || "Asia/Seoul";
  const todayKey = new Intl.DateTimeFormat("en-US", {
    weekday:"short",timeZone
  }).format(now).slice(0,3).toLowerCase();
  const dayOfMonth = Number(new Intl.DateTimeFormat("en-US", {
    day:"numeric",timeZone
  }).format(now));
  const monthlyClosed = hours.monthlyClosed;
  const isMonthlyClosingDay = monthlyClosed
    && todayKey === monthlyClosed.weekday
    && Array.isArray(monthlyClosed.weeks)
    && monthlyClosed.weeks.includes(Math.ceil(dayOfMonth / 7));

  const formatted = key => {
    const slots = hours.weekly && hours.weekly[key];
    if(slots == null) return hoursUi.unknown;
    return Array.isArray(slots) && slots.length ? slots.join(" / ").replace(/\s*\(\+1\)/g, " (" + hoursUi.nextDay + ")") : hoursUi.closed;
  };

  hoursTodayLabel.textContent = hoursUi.today;
  hoursTodayValue.textContent = isMonthlyClosingDay ? hoursUi.closed : formatted(todayKey);
  weeklyHoursSummary.textContent = hoursUi.weekly;
  const extraParts = [];
  if(hours.breakTime) extraParts.push(hoursUi.breakTime + ": " + hours.breakTime);
  if(hours.lastOrder) extraParts.push(hoursUi.lastOrder + ": " + hours.lastOrder.replace(/\s*\(\+1\)/g, " (" + hoursUi.nextDay + ")"));
  if(hours.specialHoursNotes){
    const specialNote = hours.specialHoursNotes[locale] || hours.specialHoursNotes.en;
    if(specialNote) extraParts.push(specialNote);
  }
  hoursExtras.textContent = extraParts.join(" · ");
  hoursExtras.hidden = !extraParts.length;
  hoursNote.textContent = hours.verification === "conflicting-sources" ? hoursUi.conflict : hoursUi.note;
  weeklyHoursDetails.open = false;
  weeklyHoursRows.replaceChildren();
  keys.forEach((key,index)=>{
    const row = document.createElement("div");
    row.className = "hour-row" + (key === todayKey ? " today" : "");
    const day = document.createElement("span");
    day.textContent = hoursUi.days[index];
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = formatted(key);
    row.append(day,time);
    weeklyHoursRows.appendChild(row);
  });
}

function renderBusSchedule(place){
  const schedule = place.transport && place.transport.schedule;
  busPanel.hidden = !schedule;
  if(!schedule) return;
  busHeading.textContent = busUi.heading;
  busFirstLabel.textContent = busUi.first;
  busLastLabel.textContent = busUi.last;
  const origin = schedule.originSchedule;
  busFirstValue.textContent = origin && origin.firstDeparture ? origin.firstDeparture : busUi.unverified;
  busLastValue.textContent = origin && origin.lastDeparture ? origin.lastDeparture : busUi.unverified;
  const range = schedule.approximateIntervalMinutes;
  const intervalText = Array.isArray(range) && range.length === 2
    ? range[0] + "–" + range[1] + " " + busUi.minutes : "";
  const formatWon = amount => Number(amount).toLocaleString("en-US") + " KRW";
  busDetails.textContent = [
    busUi.daily,
    busUi.interval + " ≈ " + intervalText,
    busUi.adult + " " + formatWon(schedule.adultFareWon),
    busUi.child + " " + formatWon(schedule.childFareWon)
  ].filter(Boolean).join(" · ");
  busCaution.textContent = busUi.caution;
  busTimetableLink.hidden = true;
  busTimetableLink.removeAttribute("href");
  busOfficialLink.textContent = busUi.official;
  busOfficialLink.href = schedule.officialRouteUrl;
}

function photoText(value,fallback=""){

function getPhotos(place){
  if(Array.isArray(place.photos) && place.photos.length){
    return place.photos.filter(photo=>{
      const u=photo && (photo.src || photo.url);
      return typeof u === "string" && (/^https:\/\//.test(u) || /^(\/|\.\/|photos\/)(?!\/)/.test(u));
    }).slice(0,5).map(photo=>({
      src:photo.src || photo.url,
      alt:photoText(photo.alt,primaryName(place)),
      caption:photoText(photo.caption,"")
    }));
  }
  if(photoDemo && place.category === "hotel"){
    return [
      {src:demoPhoto("#706A62","1"),alt:photoUi.sample,caption:photoUi.front+" · "+photoUi.sample},
      {src:demoPhoto("#967A62","2"),alt:photoUi.sample,caption:photoUi.entrance+" · "+photoUi.sample}
    ];
  }
  return [];
}
function updatePhotoMeta(index){
  if(!currentPhotos.length)return;
  currentPhotoIndex=Math.max(0,Math.min(index,currentPhotos.length-1));
  photoCount.textContent=(currentPhotoIndex+1)+" / "+currentPhotos.length;
  photoCaption.textContent=currentPhotos[currentPhotoIndex].caption || "";
}
function renderPhotos(place){
  closePhotoViewer();
  currentPhotos=getPhotos(place);
  photoGallery.hidden=!currentPhotos.length;
  photoTrack.replaceChildren();
  if(!currentPhotos.length) return;
  currentPhotos.forEach((photo,i)=>{
    const button=document.createElement("button");
    button.className="photo-slide";
    button.type="button";
    button.setAttribute("aria-label",photo.alt || photoUi.photo);
    const img=document.createElement("img");
    img.src=photo.src;
    img.alt=photo.alt;
    img.loading=i===0?"eager":"lazy";
    img.decoding="async";
    button.appendChild(img);
    button.addEventListener("click",()=>openPhotoViewer(i,button));
    photoTrack.appendChild(button);
  });
  photoTrack.scrollLeft=0;
  updatePhotoMeta(0);
}
photoTrack.addEventListener("scroll",()=>{
  if(!currentPhotos.length||!photoTrack.clientWidth)return;
  updatePhotoMeta(Math.round(photoTrack.scrollLeft/photoTrack.clientWidth));
},{passive:true});
function updatePhotoViewer(){
  const photo=currentPhotos[currentViewerIndex];
  if(!photo)return;
  photoViewerImg.src=photo.src;
  photoViewerImg.alt=photo.alt;
  photoViewerCaption.textContent=photo.caption;
  photoViewerCount.textContent=(currentViewerIndex+1)+" / "+currentPhotos.length;
  photoViewerPrev.hidden=currentPhotos.length<=1;
  photoViewerNext.hidden=currentPhotos.length<=1;
}
function openPhotoViewer(index,trigger){
  lastPhotoTrigger=trigger;
  currentViewerIndex=index;
  updatePhotoViewer();
  photoViewer.hidden=false;
  photoViewerClose.focus();
}
function closePhotoViewer(){
  if(photoViewer.hidden)return;
  photoViewer.hidden=true;
  photoViewerImg.removeAttribute("src");
  if(lastPhotoTrigger && lastPhotoTrigger.isConnected)lastPhotoTrigger.focus();
  lastPhotoTrigger=null;
}
photoViewerClose.addEventListener("click",closePhotoViewer);
photoViewerPrev.addEventListener("click",()=>{
  currentViewerIndex=(currentViewerIndex-1+currentPhotos.length)%currentPhotos.length;
  updatePhotoViewer();
});
photoViewerNext.addEventListener("click",()=>{
  currentViewerIndex=(currentViewerIndex+1)%currentPhotos.length;
  updatePhotoViewer();
});
photoViewer.addEventListener("click",e=>{if(e.target===photoViewer)closePhotoViewer()});
document.addEventListener("keydown",e=>{
  if(photoViewer.hidden)return;
  if(e.key==="Escape")closePhotoViewer();
  else if(e.key==="ArrowLeft")photoViewerPrev.click();
  else if(e.key==="ArrowRight")photoViewerNext.click();
});

function openPlace(place){
  renderPhotos(place);
  sheet.scrollTop=0;
  sheetName.textContent = primaryName(place);
  sheetLocal.textContent = place.category === "hotel" ? "" : secondaryName(place);
  sheetDesc.textContent = localizedDesc(place);
  renderHours(place);
  renderBusSchedule(place);
  renderBusPayment(place);

  if(place.category === "hotel"){
    mapActions.hidden = true;
    hotelNote.hidden = false;
  }else{
    mapActions.hidden = false;
    hotelNote.hidden = true;
    directionsBtn.onclick = () => openDirections(place);
    googleBtn.onclick = () => openGoogleDirections(place);
  }
  sheet.classList.add("open");
}

function openDirections(place){
  if(place.naverUrl){
    window.location.href = place.naverUrl;
    return;
  }

  const naverWeb = `https://map.naver.com/p/search/${encodeURIComponent(place.name + " " + place.address)}`;
  window.location.href = naverWeb;
}

function openGoogleDirections(place){
  if(place.googleUrl){
    window.location.href = place.googleUrl;
    return;
  }
  const query = encodeURIComponent(`${place.name} ${place.address}`);
  window.location.href = `https://www.google.com/maps/search/?api=1&query=${query}`;
}

  "hotel": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\n  <path d=\"M3 6v15M21 21v-9a3 3 0 0 0-3-3h-6v8M3 17h18\"/><rect x=\"5\" y=\"9\" width=\"5\" height=\"5\" rx=\"1.5\"/>\n</svg>",
  "spot": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg>"
};

function categoryIcon(category){
  return categoryIcons[category] || categoryIcons.spot;
}

function markerEl(place){
  if(place.category === "hotel"){
    const wrap = document.createElement("div");
    wrap.className = "hotel-wrap";
    wrap.setAttribute("aria-label", primaryName(place));
    wrap.innerHTML = `<div class="place-marker hotel">${categoryIcon(place.category)}</div><div class="hotel-label">HOHE CITY</div>`;
    wrap.addEventListener("click",(e)=>{e.stopPropagation();openPlace(place)});
    return wrap;
  }

  const el = document.createElement("div");
  el.className = `place-marker ${place.category}`;
  el.innerHTML = categoryIcon(place.category);
  el.setAttribute("aria-label", `${primaryName(place)} ${place.name}`);
  el.addEventListener("click",(e)=>{e.stopPropagation();openPlace(place)});
  return el;
}

map.on("load", async ()=>{
  try {
    const response = await fetch("./places.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Could not load places.json");

    const data = await response.json();
    places = Array.isArray(data) ? data : data.places;

    places.forEach(place=>{
      new maplibregl.Marker({element:markerEl(place),anchor:"center"})
        .setLngLat([place.lng,place.lat])
        .addTo(map);
      bounds.extend([place.lng,place.lat]);
    });

    if(photoDemo){
      const demoHotel=places.find(place=>place.category==="hotel");
      if(demoHotel)openPlace(demoHotel);
    }
    if (places.length) {
      map.fitBounds(bounds,{
        padding:{top:85,right:44,bottom:90,left:44},
        maxZoom:16.8,
        duration:0
      });
    }
  } catch (error) {
    console.error(error);
    alert(ui.loadError);
  }
});

map.on("click", closeSheet);
document.getElementById("closeBtn").addEventListener("click", closeSheet);

document.getElementById("locateBtn").addEventListener("click",()=>{
  if(!navigator.geolocation){
    alert(ui.noLocation);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lng = pos.coords.longitude;
      const lat = pos.coords.latitude;

      if(userMarker) userMarker.remove();

      const dot = document.createElement("div");
      dot.style.cssText =
        "width:18px;height:18px;border-radius:50%;background:#2676D9;border:4px solid white;box-shadow:0 2px 10px rgba(0,0,0,.3)";

      userMarker = new maplibregl.Marker({element:dot,anchor:"center"})
        .setLngLat([lng,lat])
        .addTo(map);

      map.flyTo({center:[lng,lat],zoom:17,duration:600});
      closeSheet();
    },
    ()=>alert(ui.allowLocation),
    {enableHighAccuracy:true,timeout:8000,maximumAge:30000}
  );
});
</script>
